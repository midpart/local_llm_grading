{% extends "llm_grading/base.html" %}
{% load form_tags %}
{% block title %}Import Exam{% endblock %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">📤 Upload Excel</h3>

                    <div class="container mt-5">
                        <h3>Upload Excel File</h3>

                        <!-- Upload Form -->
                        <form id="uploadForm" enctype="multipart/form-data" class="mb-3">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_file" class="form-label">Choose Excel file</label>
                                {{ form.file|add_class:"form-control" }}
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Upload</button>
                        </form>
                        <div id="message" class="mt-3"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div id="overlay" style="display:none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

{% endblock %}
{% block script %}
<script>
    let uploadedFile = null;  // To keep reference to the file

    $(document).ready(function () {
        $("#uploadForm").submit(function (e) {
            e.preventDefault();
            $("#message").html('');

            const formData = new FormData(this);
            uploadedFile = formData.get("file"); // save the file for later

            $.ajax({
                url: "{% url 'exams:processExamFile' %}",
                type: "POST",
                data: formData,
                processData: false,
                contentType: false,
                beforeSend: function(){
                    $("#overlay").show();
                },
                headers: { "X-CSRFToken": $("input[name=csrfmiddlewaretoken]").val() },
                success: function (response) {
                    console.log(response.success);
                    if (response.success) {
                        $("#message").html(`<div class='alert alert-success'>${response.message}</div>`);
                        $("#id_file").val('');
                    } else {
                        $("#message").html(`<div class='alert alert-danger'>${response.message}</div>`);
                    }
                },
                error: function () {
                    $("#message").html(`<div class='alert alert-danger'>Error processing sheet.</div>`);
                },
                complete: function () {
                    $('#overlay').hide();
                    // $('#processSheetBtn').attr('disabled', false);
                }
            });
        });
    });
</script>
{% endblock %}
